syntax = "proto3";

package ecom.product.v1;

import "google/protobuf/timestamp.proto";
import "ecom/common/v1/common.proto";

message Stock {
  int32 available = 1;
  int32 reserved = 2;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  int32 price_minor = 5;
  string currency = 6;
  Stock stock = 7;
  map<string, string> attributes = 8;
  repeated string images = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  string category = 3;
  int32 price_minor = 4;
  string currency = 5;
  int32 initial_stock = 6;
  map<string, string> attributes = 7;
  repeated string images = 8;
}

message CreateProductResponse {
  Product product = 1;
}

message UpdateProductRequest {
  string product_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string category = 4;
  optional int32 price_minor = 5;
  optional string currency = 6;
  map<string, string> attributes = 7;
  repeated string images = 8;
  optional bool is_active = 9;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  string product_id = 1;
}

message DeleteProductResponse {}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  ecom.common.v1.PaginationRequest pagination = 1;
  optional string category = 2;
  optional string search = 3;
  optional bool is_active = 4;
  optional int32 min_price_minor = 5;
  optional int32 max_price_minor = 6;
}

message ListProductsResponse {
  repeated Product products = 1;
  ecom.common.v1.PaginationResponse pagination = 2;
}

message GetProductsByIdsRequest {
  repeated string product_ids = 1;
}

message GetProductsByIdsResponse {
  repeated Product products = 1;
}

message AdjustStockRequest {
  string product_id = 1;
  int32 delta = 2;
}

message AdjustStockResponse {
  Product product = 1;
}

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProductsByIds(GetProductsByIdsRequest) returns (GetProductsByIdsResponse);
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse);
}
